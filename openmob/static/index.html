<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("openmob.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/static/ds.css">
<style>
  /* ---------- dashboard ---------- */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { flex: none; position: relative; z-index: 30; }
  .spacer { flex: 1; }
  .topbar .select { width: auto; min-height: 38px; font-size: 14px; }
  /* The phone picker sits above the phone panel and matches the screen panel's width. */
  .device-slot { width: 100%; }
  .device-slot .select { width: 100%; }
  .nav-label { display: inline; }
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-items { position: fixed; right: var(--gutter); top: 60px; min-width: 248px; max-width: calc(100vw - 2 * var(--gutter)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; box-shadow: var(--shadow-lg); z-index: 40; }
  .menu-items button, .menu-items a { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; color: var(--fg); text-decoration: none; font-size: 14px; }
  .menu-items button:hover, .menu-items a:hover { background: var(--surface-2); }
  .menu-items svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .menu-items hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu-items .who { padding: 8px 10px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  /* Like Claude: a full-height sidebar (logo, toggle and search at its top, its border running top to
     bottom), and the main column with its own top bar. Collapsed, only a "show sidebar" button remains. */
  .app { flex: 1; display: flex; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .layout { flex: 1; display: flex; min-height: 0; position: relative; }
  /* No box around the top of the chat: the top bar floats on the chat's own background. */
  .main > .topbar { background: transparent; border-bottom: 0; }
  .tip.tip-right:hover::after, .tip.tip-right:focus-visible::after { left: auto; right: 0; }
  .panel-head { min-height: 40px; margin-top: -2px; }
  .side-head { display: flex; align-items: center; gap: 2px; min-height: 40px; margin: -2px 0 4px 6px; }
  .side-head .brand { font-size: 22px; }
  /* Tooltips (dark chip with the shortcut), like Claude's "Show sidebar ⌘B". */
  .tip { position: relative; }
  .tip:hover::after, .tip:focus-visible::after { content: attr(data-tip) "   " attr(data-kbd); white-space: pre; position: absolute; top: calc(100% + 6px); left: 0; z-index: 70; padding: 5px 9px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 12.5px; font-weight: 500; line-height: 1.3; pointer-events: none; box-shadow: var(--shadow); }
  .side-head .tip:last-child:hover::after, .side-head .tip:last-child:focus-visible::after { left: auto; right: 0; }

  /* Sidebar: saved chats, plus the way to memory and the developer API */
  .sidebar { width: 272px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; padding: 12px 10px; gap: 8px; min-height: 0; }
  .sidebar.hidden { display: none; }
  .new-chat { justify-content: flex-start; font-weight: 600; }
  .side-label { color: var(--faint); font-size: 12px; font-weight: 600; margin: 8px 8px 0; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; margin: 0 -2px; padding: 0 2px; }
  .chat-item { display: flex; align-items: center; gap: 2px; border-radius: 10px; min-width: 0; }
  .chat-item:hover, .chat-item.active { background: var(--surface-2); }
  .chat-open { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .chat-item .title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item.active .title { font-weight: 600; }
  .chat-item .sub { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .act { visibility: hidden; border: 0; background: transparent; cursor: pointer; color: var(--faint); width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .chat-item .act svg { width: 15px; height: 15px; }
  .chat-item:hover .act, .chat-item.active .act, .chat-item:focus-within .act { visibility: visible; }
  .chat-item .act:hover { color: var(--fg); background: var(--surface); }
  .chat-item .act.del:hover { color: var(--bad); }
  @media (hover: none) { .chat-item .act { visibility: visible; } }
  .side-empty { color: var(--faint); font-size: 13px; padding: 8px 10px; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
  /* Search dialog (the 🔍 in the header, or ⌘K / Ctrl+K), like Claude's. */
  .search-overlay { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 12vh var(--gutter) var(--gutter); }
  .search-dialog { width: min(720px, 100%); max-height: 70vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
  .search-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 20px; border-bottom: 1px solid var(--line); }
  .search-head > svg { width: 20px; height: 20px; color: var(--faint); flex: none; }
  .search-head input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; outline: none; padding: 6px 0; }
  .search-head input::placeholder { color: var(--faint); }
  .search-head input::-webkit-search-cancel-button { display: none; }
  .search-results { overflow-y: auto; padding: 8px; }
  .search-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; color: var(--fg); }
  .search-row[aria-selected="true"] { background: var(--surface-2); }
  .search-row > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search-row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .search-row .when { color: var(--faint); font-size: 13px; flex: none; }
  .search-row .enter { display: none; color: var(--faint); flex: none; }
  .search-row .enter svg { width: 16px; height: 16px; }
  .search-row[aria-selected="true"] .when { display: none; }
  .search-row[aria-selected="true"] .enter { display: inline-flex; }
  .search-empty { color: var(--faint); font-size: 14px; padding: 14px 12px; }
  @media (max-width: 560px) { .search-overlay { padding-top: 8px; } .search-dialog { max-height: 82vh; } }
  /* Account button (bottom left, like Claude): opens the account and settings menu upward. */
  .account-btn { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; cursor: pointer; color: var(--fg); }
  .account-btn:hover, .menu.account[open] .account-btn { background: var(--surface-2); }
  .acct-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
  .acct-avatar svg { width: 17px; height: 17px; }
  .acct-text { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
  .acct-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-sub { font-size: 12px; color: var(--faint); }
  .account-btn .chev { color: var(--faint); display: inline-flex; }
  .account-btn .chev svg { width: 16px; height: 16px; }
  .menu.account .menu-items { position: absolute; top: auto; right: 0; left: 0; bottom: calc(100% + 6px); min-width: 0; max-width: none; }
  .menu.account .who { display: none; }
  .menu-label { padding: 4px 10px 2px; color: var(--faint); font-size: 12px; font-weight: 600; }
  .side-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--fg); text-decoration: none; font-size: 14px; }
  .side-link:hover { background: var(--surface-2); }
  .side-link svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
  .side-link span.txt { flex: 1; min-width: 0; }
  .side-link small { display: block; color: var(--faint); font-size: 12px; }
  .count.warn { background: var(--warn-soft); color: var(--warn); }

  /* Conversation */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .thread { flex: 1; overflow-y: auto; padding: 24px var(--gutter) 8px; }
  .column { max-width: 760px; margin: 0 auto; }
  .note { text-align: center; color: var(--faint); font-size: 12px; margin: 10px 0 18px; }
  .turn { margin: 0 0 30px; }
  .user { display: flex; justify-content: flex-end; margin: 0 0 14px; }
  .user > div { background: var(--accent-soft); color: var(--fg); padding: 10px 14px; border-radius: 18px 18px 6px 18px; max-width: min(80%, 560px); overflow-wrap: anywhere; white-space: pre-wrap; }
  .user.reply { margin: 10px 0; }
  .user.reply > div { font-size: 14px; padding: 7px 12px; }
  .user.correction > div { background: var(--surface); border: 1px dashed var(--accent-line); }
  .user .tag { display: block; font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; white-space: normal; }
  .agent { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
  .avatar { width: 30px; height: 30px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .avatar svg { width: 18px; height: 18px; }
  .avatar.spin svg { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .body { min-width: 0; padding-top: 3px; }
  .turn-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 24px; }
  .text { overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 8px; }
  .text.error { color: var(--bad); }
  .text.ask { font-weight: 600; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin-top: 8px; overflow-wrap: anywhere; }
  .live .bar-anim { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); flex: none; animation: om-pulse 1.2s ease-in-out infinite; }
  .live .dots::after { content: "…"; animation: blink 1.2s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  details.steps summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 8px; align-items: center; user-select: none; border-radius: 8px; padding: 2px 4px 2px 0; }
  details.steps summary:hover { color: var(--fg); }
  details.steps summary::-webkit-details-marker { display: none; }
  details.steps summary .chev { width: 14px; height: 14px; transition: transform .15s; }
  details.steps[open] summary .chev { transform: rotate(90deg); }
  .step-list { margin: 10px 0 4px 3px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .step { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .step b { font-weight: 600; color: var(--fg); margin-right: 4px; }
  .step.err { color: var(--bad); }
  .answers { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .answers .or { color: var(--muted); font-size: 13px; }
  .callout.confirm { margin-top: 10px; }
  .memory-note { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: 14px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; }
  .memory-note > svg { width: 18px; height: 18px; color: var(--accent); margin-top: 2px; }
  .memory-note .msg { overflow-wrap: anywhere; }
  .memory-note .answers, .memory-note .more { grid-column: 2; }
  .memory-note .answers { margin-top: 4px; }
  .memory-note .more { font-size: 13px; color: var(--muted); }
  .memory-note .more a { color: var(--accent); text-decoration: none; }
  .memory-note.pending { border-color: var(--accent-line); background: var(--accent-soft); }
  .foot { display: flex; align-items: center; gap: 2px; margin-top: 6px; color: var(--faint); font-size: 12px; flex-wrap: wrap; }
  .foot button { border: 0; background: transparent; color: var(--faint); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
  .foot button svg { width: 16px; height: 16px; }
  .foot button:hover { background: var(--surface-2); color: var(--fg); }
  .foot .fb.on { color: var(--accent); background: var(--accent-soft); }
  .foot .tokens { margin-left: 8px; font-variant-numeric: tabular-nums; }

  /* Empty and first-run states */
  .empty { max-width: 640px; margin: 10vh auto 0; text-align: center; }
  .empty h1 { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.025em; margin: 0 0 8px; }
  .empty > p { color: var(--muted); margin: 0 auto 22px; max-width: 48ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 8px 14px; cursor: pointer; color: var(--muted); font-size: 14px; text-align: left; }
  .chips button:hover { color: var(--fg); border-color: var(--line-strong); }
  .discover { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 28px; text-align: left; }
  .discover a { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 14px; }
  .discover a:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .discover svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 1px; }
  .discover b { display: block; font-weight: 600; }
  .discover span { color: var(--muted); font-size: 13px; }
  .onboard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow); margin-top: 6px; }
  .onboard ol { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 14px; counter-reset: step; }
  .onboard li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; counter-increment: step; }
  .onboard li::before { content: counter(step); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .onboard li b { display: block; }
  .onboard li span { color: var(--muted); font-size: 14px; }
  .onboard .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .onboard .row .muted { font-size: 13px; }
  .offline-callout { margin: 0 auto 20px; max-width: 640px; text-align: left; }

  /* Task bar: the running task's state, right above the composer */
  .taskbar { max-width: 760px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); font-size: 14px; }
  .taskbar.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
  .taskbar .task-now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .taskbar .task-meta { color: var(--faint); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Composer */
  .composer-wrap { padding: 8px var(--gutter) 12px; flex: none; }
  .composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 12px 10px 8px 16px; box-shadow: var(--shadow); transition: border-color .12s, box-shadow .12s; }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .composer textarea { width: 100%; border: 0; outline: 0; background: transparent; resize: none; min-height: 26px; max-height: 200px; padding: 2px 0; line-height: 1.5; font-size: 15px; }
  .composer textarea:focus-visible { outline: 0; }
  .composer textarea::placeholder { color: var(--faint); }
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .bar .hint { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .queue-toggle { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: var(--r-pill); padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .queue-toggle svg { width: 13px; height: 13px; }
  .queue-toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
  .model { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--muted); padding: 6px 22px 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; max-width: min(40vw, 180px); text-overflow: ellipsis; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 10px top 55%, right 6px top 55%; background-size: 4px 4px; background-repeat: no-repeat; }
  .model:hover { background-color: var(--surface-2); color: var(--fg); }
  .model optgroup { font-style: normal; font-weight: 600; }
  .mic { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .mic svg { width: 19px; height: 19px; }
  .mic:hover { background: var(--surface-2); color: var(--fg); }
  .mic.rec { background: var(--bad); color: #fff; animation: blink 1.2s infinite; }
  .mic.busy { opacity: .5; cursor: progress; }
  .mic:disabled { opacity: .3; cursor: default; }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .send svg { width: 18px; height: 18px; }
  .send:disabled { opacity: .35; cursor: default; }
  .send.stop { background: var(--fg); color: var(--bg); }
  .disclaimer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 8px; }

  /* Live screen panel */
  .panel { width: 340px; flex: none; border-left: 1px solid var(--line); background: var(--surface); padding: 14px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel.hidden { display: none; }
  .panel-head { display: flex; align-items: center; gap: 8px; }
  .panel-head h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .phone { background: #0a0b0d; border-radius: 30px; padding: 8px; box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,.08); width: 100%; max-width: 300px; margin: 0 auto; }
  .phone-screen { position: relative; border-radius: 23px; overflow: hidden; background: #14161b; }
  .phone-screen.blank { aspect-ratio: 9 / 19; }
  .phone img, .phone canvas { width: 100%; display: block; max-height: calc(100vh - 170px); object-fit: contain; background: #14161b; }
  .phone-screen.blank img, .phone-screen.blank canvas { display: none; }
  /* What the live view is showing (video or snapshots, its size and rate) and the quality choice. */
  .screen-meta { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 300px; margin: -4px auto 0; min-height: 28px; }
  .screen-info { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .screen-info b { font-weight: 600; color: var(--fg); }
  .screen-info.jpeg b { color: var(--warn); }
  .screen-meta .select { width: auto; min-height: 28px; padding: 2px 8px; font-size: 12px; border-radius: 8px; flex: none; }
  .screen-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; color: #c9ced8; font-size: 13px; }
  .screen-overlay svg { width: 30px; height: 30px; opacity: .6; }
  .screen-overlay.banner { inset: auto 8px 8px 8px; padding: 8px 10px; border-radius: 12px; background: rgba(10, 11, 13, .82); flex-direction: row; justify-content: flex-start; gap: 8px; text-align: left; }
  .screen-overlay.banner svg { width: 16px; height: 16px; flex: none; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.idle { background: var(--ok); }
  .dot.running { background: var(--accent); animation: blink 1.2s infinite; }
  .dot.asking { background: var(--warn); }
  .dot.offline { background: var(--bad); }
  .panel-info { display: grid; gap: 2px; }
  .panel small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .panel small:empty { display: none; }

  .scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 45; }
  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; box-shadow: var(--shadow-lg); width: min(300px, 86vw); }

<body>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {  // all dynamic text goes in as textContent, never HTML
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
// Static SVG icons (constants written here, never user content).
const ICONS = {
  mark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6M4.9 4.9l4.3 4.3M14.8 14.8l4.3 4.3M4.9 19.1l4.3-4.3M14.8 9.2l4.3-4.3"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
  up_thumb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H4V10zM7 10l4-7a2.5 2.5 0 0 1 2.5 3L13 10h5.6a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17.2 21H7"/></svg>',
  down_thumb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3h3v11zM17 14l-4 7a2.5 2.5 0 0 1-2.5-3l.5-4H5.4a2 2 0 0 1-2-2.4l1.4-7A2 2 0 0 1 6.8 3H17"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18h3"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19zM12 10v4M12 17.5v.01"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};
const icon = (name, cls) => {
  const holder = document.createElement("span");
  holder.innerHTML = ICONS[name];  // static constant above, not user content
  const svg = holder.firstChild;
  if (cls) svg.classList.add(cls);
  return svg;
};
const EXAMPLES = [
  "Open YouTube and search for lofi music",
  "Open Settings and turn on dark mode",
  "Open Chrome and go to wikipedia.org",
  "Set a timer for 10 minutes",
];

let accounts = false;
let deviceId = null;
let deviceCount = 0;
let last = null;            // latest status snapshot
let lastSignature = "";     // re-render only when something changed
let pendingNotes = new Set();  // ids of memory suggestions still waiting for Keep/Dismiss
const checkedNotes = new Set();  // suggestion ids we've already looked up once
let lastChatId = null;
let modelLabels = {};
let openSteps = new Set();  // task ids whose step list the user expanded
let screenError = "";
let screenMode = "";        // "video" (H.264 on the canvas) or "jpeg" (frames in the <img>)
let hasFrame = false;       // something is on the live-screen surface for this phone
let queueNext = false;      // "Queue as new task" is on for the next send
let speak = false;
let lastSpokenSeq = 0;
try { speak = localStorage.getItem("openmob.speak") === "1"; } catch {}
const withToken = (path) => token ? `${path}${path.includes("?") ? "&" : "?"}t=${encodeURIComponent(token)}` : path;

// ---------- server ----------

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-OpenMob-Token": token, ...(opts.headers || {}) } });
  if (res.status === 401) {
    if (accounts) location.href = "/login?next=" + encodeURIComponent(location.pathname);
    throw new Error(accounts ? "Signed out." : "Bad token: open the link printed by `openmob run`.");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.headers.get("content-type")?.includes("json") ? res.json() : res;
}

async function checkAccount() {
  try {
    const me = await (await fetch("/api/auth/me")).json();
    accounts = !!me.accounts;
    if (accounts && !me.email) {
      location.href = "/login?next=" + encodeURIComponent(location.pathname);
      return false;
    }
    if (accounts) {
      $("who").textContent = me.email;
      $("who").hidden = $("signout").hidden = $("signoutRule").hidden = false;
      $("adminLink").hidden = !me.admin;
      $("developerLink").hidden = !me.accounts;
      $("acctAvatar").textContent = (me.email || "?").trim()[0].toUpperCase();
      $("acctName").textContent = me.email;
      $("acctSub").textContent = me.admin ? "Admin" : "Signed in";
      $("connectPhone").href = "/connect";
    } else {
      $("connectPhone").href = `/connect?t=${encodeURIComponent(token)}`;
    }
  } catch {}
  return true;
}

// Models, grouped by provider. Older servers send neither `provider` nor `available`:
// those models are Anthropic's and usable.
const shortModel = (label) => label.replace(/\s*\(.*\)$/, "");
// The closed picker shows only the model's name; "add an API key" stays on the options in the list.
// (A disabled option is only ever selected when the phone already uses a model whose key is missing.)
const NEEDS_KEY = " · add an API key";
function syncModelLabel() {
  for (const o of $("model").options) {
    const name = o.dataset.name || o.textContent;
    o.textContent = o.disabled && !o.selected ? name + NEEDS_KEY : name;
  }
}
const PROVIDERS = { anthropic: "Anthropic", openai: "OpenAI", google: "Google", gemini: "Google", mistral: "Mistral", xai: "xAI", openrouter: "OpenRouter", local: "Local" };
const providerName = (p) => PROVIDERS[(p || "anthropic").toLowerCase()] || (p.charAt(0).toUpperCase() + p.slice(1));
async function loadModels() {
  try {
    const m = await api("/api/models");
    modelLabels = Object.fromEntries(m.models.map((x) => [x.id, x.label]));
    const groups = new Map();
    for (const x of m.models) {
      const name = providerName(x.provider);
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(x);
    }
    const option = (x) => {
      const usable = x.available !== false;
      const o = el("option", "", shortModel(x.label) + (usable ? "" : NEEDS_KEY));
      o.value = x.id;
      o.dataset.name = shortModel(x.label);
      o.disabled = !usable;
      if (!usable) o.title = `Add a ${providerName(x.provider)} API key to use this model.`;
      return o;
    };
    // One provider: a flat list, as before. Several: one labelled group each.
    $("model").replaceChildren(...(groups.size < 2 ? m.models.map(option) : [...groups].map(([name, list]) => {
      const g = document.createElement("optgroup");
      const none = list.every((x) => x.available === false);
      g.label = none ? `${name} (add an API key)` : name;
      g.append(...list.map(option));
      return g;
    })));
    $("model").value = m.default;
    syncModelLabel();
    const locked = m.models.filter((x) => x.available === false).length;
    $("model").title = locked ? `Model for this phone's next task. ${locked} more model${locked === 1 ? "" : "s"} unlock when you add that provider's API key.` : "Model for this phone's next task";
  } catch {}
}

async function loadDevices(rescan = false) {
  try {
    const devices = await api(`/api/devices${rescan ? "?rescan=true" : ""}`);
    deviceCount = devices.length;
    $("device").replaceChildren(...devices.map((d) => {
      const o = el("option", "", `${d.model}${d.online ? "" : " · offline"}`);
      o.value = d.id;
      return o;
    }));
    $("device").hidden = !devices.length;
    if (!devices.length) { deviceId = null; render(null); return; }
    if (!devices.some((d) => d.id === deviceId)) { deviceId = (devices.find((d) => d.online) || devices[0]).id; resetScreen(); }
    $("device").value = deviceId;
  } catch (e) { $("state").textContent = e.message; }
}

// mode "auto": while a task runs, the message corrects it (or answers its question);
// mode "queue": it becomes a new task that runs afterwards.
async function send(text, mode = "auto") {
  text = text.trim();
  if (!text || !deviceId) return;
  try {
    await api(`/api/devices/${deviceId}/command`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, mode }) });
    stickToBottom = true;
    pollNow();
  } catch (e) { setHint(e.message); }
}

const stopTask = () => deviceId && api(`/api/devices/${deviceId}/stop`, { method: "POST" }).catch(() => {});

// ---------- conversation ----------

// Group the flat event log into turns: one per task, plus loose system notes.
function buildTurns(log) {
  const items = [];
  const byTask = new Map();
  for (const e of log) {
    if (e.task === null || e.task === undefined) {
      if (e.kind === "status") items.push({ note: e.message });
      continue;
    }
    if (!byTask.has(e.task)) {
      const turn = { id: e.task, events: [] };
      byTask.set(e.task, turn);
      items.push(turn);
    }
    byTask.get(e.task).events.push(e);
  }
  return items;
}

const stripSource = (m) => m.replace(/^\[[^\]]+\]\s*/, "");
const stripSteps = (m) => m.replace(/\s*\(\d+ steps?\)$/, "");
const STEP_KINDS = new Set(["action", "thought", "status", "error"]);
// "type: jazz music" → "Type: jazz music"
const stepText = (e) => e.message.replace(/^(\w+): /, (_, verb) => verb.charAt(0).toUpperCase() + verb.slice(1).replace(/_/g, " ") + ": ");
const isStart = (e) => e.kind === "status" && e.message.startsWith("Working on:");

// queued · running · asking · confirm · done · failed · stopped · unfinished
const STATES = {
  queued: ["Queued", "dotted"],
  running: ["Working", "dotted info live"],
  asking: ["Needs your answer", "dotted warn"],
  confirm: ["Approve on your phone", "dotted warn live"],
  done: ["Done", "ok"],
  failed: ["Failed", "bad"],
  stopped: ["Stopped", ""],
  unfinished: ["Didn't finish", ""],
};
function turnState(turn, s) {
  const final = turn.events.find((e) => e.data && e.data.final);
  if (final) return final.data.cancelled ? "stopped" : final.data.success ? "done" : "failed";
  if (s && s.task_id === turn.id) {
    if (s.state !== "asking") return "running";
    const q = [...turn.events].reverse().find((e) => e.kind === "question");
    return s.question_kind === "confirm" || (q && q.data && q.data.confirm) ? "confirm" : "asking";
  }
  // Not running and no outcome: still waiting its turn, or (in a saved chat) cut off part-way.
  return turn.events.some((e) => isStart(e) || e.kind === "action") ? "unfinished" : "queued";
}
const statePill = (state) => el("span", `pill ${STATES[state][1]}`, STATES[state][0]);

function renderTurn(turn, s) {
  const wrap = el("div", "turn");
  const events = turn.events;
  const heard = events.filter((e) => e.kind === "heard");
  const final = events.find((e) => e.data && e.data.final);
  const usage = events.find((e) => e.kind === "usage");
  const active = s && s.task_id === turn.id;
  const state = turnState(turn, s);

  if (heard[0]) {
    const u = el("div", "user");
    u.append(el("div", "", stripSource(heard[0].message)));
    wrap.append(u);
  }

  const agent = el("div", "agent");
  const avatar = el("div", "avatar");
  avatar.append(icon("mark"));
  if (active && !final) avatar.classList.add("spin");
  const body = el("div", "body");
  agent.append(avatar, body);

  // Head: the task's state, and its steps (everything except the request, questions, answers,
  // corrections, the outcome and tokens) behind a disclosure.
  const steps = events.filter((e) => STEP_KINDS.has(e.kind) && e !== final && !isStart(e));
  const head = el("div", "turn-head");
  if (steps.length) {
    const details = el("details", "steps");
    details.open = openSteps.has(turn.id);
    details.addEventListener("toggle", () => { details.open ? openSteps.add(turn.id) : openSteps.delete(turn.id); });
    const secs = Math.max(0, Math.round((final || events[events.length - 1]).time - events[0].time));
    const n = final && final.data.steps !== undefined ? final.data.steps : steps.filter((e) => e.kind === "action").length;
    const summary = el("summary");
    summary.append(statePill(state), icon("chev"), el("span", "", `${n ? `${n} step${n === 1 ? "" : "s"}` : "Details"} · ${secs}s`));
    details.append(summary);
    const list = el("div", "step-list");
    for (const e of steps) {
      const row = el("div", `step${e.kind === "error" ? " err" : ""}`);
      const m = e.message.match(/^(\w+): ([\s\S]*)$/);
      if (e.kind === "action" && m) {
        row.append(el("b", "", m[1].replace(/_/g, " ")));
        row.append(document.createTextNode(m[2]));
      } else {
        row.textContent = e.message;
      }
      list.append(row);
    }
    details.append(list);
    head.append(details);
  } else {
    head.append(statePill(state));
  }
  body.append(head);

  // Questions, the user's answers and mid-task corrections, in order.
  const extras = events.filter((e) => e.kind === "question" || e.kind === "correction" || (e.kind === "heard" && e !== heard[0]));
  extras.forEach((e, i) => {
    if (e.kind === "question") {
      body.append(el("div", "text ask", e.message));
      const later = extras.slice(i + 1);
      const pending = !later.some((x) => x.kind === "question" || x.kind === "heard");
      if (active && s.state === "asking" && pending) {
        const confirm = state === "confirm";
        if (confirm) {
          const call = el("div", "callout warn confirm");
          const txt = el("div");
          txt.append(el("b", "", "Approve on your phone"), document.createTextNode("Your phone shows this step for you to approve. Nothing happens until you do."));
          call.append(icon("phone"), txt);
          body.append(call);
        }
        // confirm_on_phone: only the phone may approve this step, so the dashboard offers no buttons.
        if (confirm && s.confirm_on_phone) return;
        const row = el("div", "answers");
        const yes = el("button", "btn btn-sm btn-primary", confirm ? "Approve" : "Yes");
        const no = el("button", "btn btn-sm", confirm ? "Don't" : "No");
        yes.type = no.type = "button";
        yes.onclick = () => send("yes");
        no.onclick = () => send("no");
        if (confirm) row.append(el("span", "or", "Or answer here:"));
        row.append(yes, no);
        body.append(row);
      }
    } else {
      const correction = e.kind === "correction";
      const u = el("div", `user reply${correction ? " correction" : ""}`);
      const bubble = el("div");
      if (correction) bubble.append(el("span", "tag", "Correction"));
      bubble.append(document.createTextNode(stripSource(e.message)));
      u.append(bubble);
      body.append(u);
    }
  });

  // Memory: what the agent saved, or suggests saving (Keep/Dismiss while it's still pending).
  for (const e of events.filter((x) => x.kind === "memory")) {
    const id = e.data && e.data.note_id;
    const proposed = e.data && e.data.status === "proposed";
    if (proposed && !pendingNotes.has(id) && !checkedNotes.has(id)) {
      checkedNotes.add(id);  // a suggestion that arrived since the last lookup: fetch its state once
      loadPendingNotes().then(() => pollNow());
    }
    const waiting = proposed && pendingNotes.has(id);
    const card = el("div", `memory-note${waiting ? " pending" : ""}`);
    card.append(icon("star"), el("div", "msg", e.message));
    if (waiting) {
      const row = el("div", "answers");
      const keep = el("button", "btn btn-sm btn-primary", "Keep");
      const dismiss = el("button", "btn btn-sm", "Dismiss");
      keep.type = dismiss.type = "button";
      keep.onclick = () => decideNote(id, true);
      dismiss.onclick = () => decideNote(id, false);
      row.append(keep, dismiss);
      card.append(row);
    } else {
      const more = el("div", "more");
      const a = el("a", "", "See what I've learned");
      a.href = withToken("/memory");
      more.append(a);
      card.append(more);
    }
    body.append(card);
  }

  if (final) {
    body.append(el("div", `text${final.data.success ? "" : " error"}`, stripSteps(final.message)));
    const foot = el("div", "foot");
    const copy = el("button");
    copy.append(icon("copy"));
    copy.title = "Copy reply";
    copy.setAttribute("aria-label", "Copy reply");
    copy.onclick = () => navigator.clipboard?.writeText(stripSteps(final.message));
    const retry = el("button");
    retry.append(icon("retry"));
    retry.title = "Run this request again";
    retry.setAttribute("aria-label", "Run this request again");
    retry.onclick = () => heard[0] && send(stripSource(heard[0].message), s && s.task_id ? "queue" : "auto");
    const given = (s && s.feedback && s.feedback[turn.id]) || 0;
    for (const [value, name, title] of [[1, "up_thumb", "Good result"], [-1, "down_thumb", "Bad result"]]) {
      const b = el("button", given === value ? "fb on" : "fb");
      b.append(icon(name));
      b.setAttribute("aria-pressed", String(given === value));
      b.setAttribute("aria-label", title);
      b.title = title;
      b.onclick = async () => {
        const next = given === value ? 0 : value;  // click again to clear
        try {
          await api(`/api/turns/${turn.id}/feedback`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ value: next }) });
        } catch (e) { $("hint").dataset.note = e.message; }
        lastSignature = "";
        pollNow();
      };
      foot.append(b);
    }
    foot.append(copy, retry);
    const used = usage && usage.data ? modelTokens(usage.data) : "";
    if (used) foot.append(el("span", "tokens", used));
    body.append(foot);
  } else if (active && s.state !== "asking") {
    const latest = [...steps].reverse().find((e) => e.kind !== "error");
    const live = el("div", "live");
    live.append(el("span", "bar-anim"), el("span", "", latest ? stepText(latest) : "Starting"), el("span", "dots"));
    body.append(live);
  } else if (state === "queued") {
    body.append(el("div", "live", "Waits for the current task to finish."));
  }

  wrap.append(agent);
  return wrap;
}

async function loadPendingNotes() {
  try {
    const notes = (await api("/api/memory")).notes;  // api() returns parsed JSON
    const next = new Set(notes.filter((n) => n.status === "proposed").map((n) => n.id));
    for (const n of notes) checkedNotes.add(n.id);
    if ([...next].join() !== [...pendingNotes].join()) { pendingNotes = next; lastSignature = ""; }
    for (const id of ["memoryBadge"]) {
      $(id).hidden = !next.size;
      $(id).textContent = next.size;
    }
    $("memoryBadge").title = `${next.size} suggestion${next.size === 1 ? "" : "s"} waiting for your OK`;
  } catch {}  // memory is optional on some servers
}

async function decideNote(id, keep) {
  try {
    await api(`/api/memory/${id}`, keep
      ? { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "active" }) }
      : { method: "DELETE" });
  } catch (e) { $("hint").dataset.note = e.message; }
  await loadPendingNotes();
  lastSignature = "";
  pollNow();
}

const fmt = (n) => (n || 0) >= 10000 ? `${(n / 1000).toFixed(1)}k` : (n || 0).toLocaleString();
const modelName = (id) => shortModel(modelLabels[id] || id);
// Tokens per model that served them (as reported by the API), optionally only one model. Jev isn't shown.
function modelTokens(u, onlyModel) {
  const entries = Object.entries((u && u.by_model) || {}).filter(([m]) => !onlyModel || m === onlyModel);
  return entries.map(([m, c]) => `${fmt(c.input + c.output)} tokens · ${modelName(m)}`).join("  ·  ");
}

function discoverLinks() {
  const box = el("div", "discover");

  if (accounts) box.append(link("/developer", "code", "Connect an AI agent", "Let Claude, Cursor or your own code use your phone."));
  return box;
}

function renderEmpty() {
  if (!deviceId) return renderFirstRun();

  const box = el("div", "empty");

    const call = el("div", "callout warn offline-callout");
    const txt = el("div");
    txt.append(el("b", "", "Your phone is offline"), document.createTextNode("Open the OpenMob app on it and tap Connect. Tasks you send now start when it's back."));
    call.append(icon("alert"), txt);
    box.append(call);
  }
  box.append(el("h1", "", "What should your phone do?"));
  box.append(el("p", "", "Ask in plain words. The agent works on your phone step by step, and you can watch it live."));

  for (const t of EXAMPLES) {

    b.type = "button";
    b.onclick = () => send(t);
    chips.append(b);
  }
  box.append(chips, discoverLinks());

}

let stickToBottom = true;
$("thread").addEventListener("scroll", () => {
  const t = $("thread");
  stickToBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 80;
});

// The task bar above the composer: what's running now, and how far it got.
function renderTaskBar(s) {
  const bar = $("taskBar");
  if (!s || !s.task_id) { bar.hidden = true; return; }
  const events = s.log.filter((e) => e.task === s.task_id);
  const state = turnState({ id: s.task_id, events }, s);
  const latest = [...events].reverse().find((e) => (e.kind === "action" || e.kind === "status") && !isStart(e));
  const steps = events.filter((e) => e.kind === "action").length;
  const started = (events.find(isStart) || events[0] || { time: Date.now() / 1000 }).time;
  const secs = Math.max(0, Math.round(Date.now() / 1000 - started));
  bar.hidden = false;
  const reconnecting = !!(s.device && s.device.reconnecting);
  bar.classList.toggle("warn", reconnecting || state === "asking" || state === "confirm");
  const [label, cls] = reconnecting ? ["Reconnecting", "dotted warn live"] : STATES[state];
  $("taskPill").className = `pill ${cls}`;
  $("taskPill").textContent = label;
  $("taskNow").textContent = reconnecting ? "Reconnecting to your phone… The task waits up to 45 s for it."
    : state === "confirm" ? "Check your phone to approve the next step."
    : state === "asking" ? (s.question || "Answer below, or type a reply.")
    : latest ? stepText(latest) : (s.current || "Starting…");
  const time = secs >= 60 ? `${Math.floor(secs / 60)}m ${secs % 60}s` : `${secs}s`;
  $("taskMeta").textContent = `${steps} step${steps === 1 ? "" : "s"} · ${time}${s.queued ? ` · ${s.queued} queued` : ""}`;
}

function render(s) {
  last = s;
  const reconnecting = !!(s && s.device && s.device.reconnecting);
  const state = !s ? "offline" : reconnecting ? "asking" : (s.device && s.device.online === false ? "offline" : s.state);
  const confirming = s && s.state === "asking" && s.question_kind === "confirm";
  $("state").textContent = reconnecting ? "Reconnecting to your phone…" : confirming ? "Approve on your phone" : ({ idle: "Ready", running: "Working", asking: "Waiting for your answer", offline: deviceId ? "Phone offline" : "No phone connected" }[state] || state);
  const sess = s && s.usage && s.usage.session;
  const selected = (s && s.model) || $("model").value;
  const sessionText = modelTokens(sess, selected);
  $("sessionTokens").textContent = sessionText ? `This session: ${sessionText}` : "";
  if (s && s.model && document.activeElement !== $("model") && $("model").value !== s.model) { $("model").value = s.model; syncModelLabel(); }
  renderTaskBar(s);
  renderScreenState();
  updateComposer();

  // Rebuild the thread only when the conversation changed.
  const log = s ? s.log : [];
  const signature = `${deviceId}|${log.length ? log[log.length - 1].seq : 0}|${log.length}|${s && s.state}|${s && s.question_kind}|${s && s.queued}|${s && s.task_id}|${s && s.chat_id}|${s && s.device && s.device.online}|${s && s.device && s.device.reconnecting}|${s && s.confirm_on_phone}|${accounts}|${JSON.stringify((s && s.feedback) || {})}`;
  if (signature === lastSignature) return;
  lastSignature = signature;
  // Refresh the sidebar when the open chat changes, or when a task has just finished.
  const chatId = (s && s.chat_id) || null;
  if (chatId !== lastChatId || (s && s.state === "idle")) loadChats();
  lastChatId = chatId;
  const items = buildTurns(log);
  const column = $("column");
  if (!items.some((x) => x.events)) {
    column.replaceChildren(renderEmpty());
  } else {
    column.replaceChildren(...items.map((x) => x.note ? el("div", "note", x.note) : renderTurn(x, s)));
  }
  if (stickToBottom) $("thread").scrollTop = $("thread").scrollHeight;
  speakNew(log);
}

function speakNew(log) {
  const newest = log.length ? log[log.length - 1].seq : 0;
  if (speak && "speechSynthesis" in window) {
    for (const e of log) {
      if (e.seq > lastSpokenSeq && (e.kind === "question" || (e.data && e.data.final))) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(stripSteps(e.message)));
      }
    }
  }
  lastSpokenSeq = Math.max(lastSpokenSeq, newest);
}

// ---------- composer ----------

function updateComposer() {
  const hasText = !!$("text").value.trim();
  const taskOn = !!(last && last.task_id);
  const running = !!(last && last.state === "running");
  const asking = !!(last && last.state === "asking");
  const phoneOnly = asking && last.question_kind === "confirm" && !!last.confirm_on_phone;  // only the phone can approve
  const busy = running && !hasText;  // empty box while working: the button stops
  const btn = $("send");
  const kind = busy ? "stop" : "up";
  if (btn.dataset.icon !== kind) { btn.replaceChildren(icon(kind)); btn.dataset.icon = kind; }
  btn.classList.toggle("stop", busy);
  const sendLabel = queueNext && taskOn ? "Queue as a new task" : running ? "Send correction" : asking ? "Send answer" : "Send";
  btn.setAttribute("aria-label", busy ? "Stop" : sendLabel);
  btn.title = busy ? "Stop the task" : sendLabel;
  btn.disabled = !deviceId || (!busy && !hasText);
  if (!taskOn && queueNext) queueNext = false;
  $("queueToggle").hidden = !taskOn;
  $("queueToggle").setAttribute("aria-pressed", String(queueNext));
  $("text").placeholder = !deviceId ? "Connect a phone to start" : queueNext && taskOn ? "Describe the next task…"
    : phoneOnly ? "Approve or decline on your phone…" : asking ? "Type your answer…" : running ? "Correct or add to the current task…" : "Tell your phone what to do…";
  const offline = !last || (last.device && last.device.online === false);
  $("hint").textContent = recorder ? $("hint").dataset.note : !deviceId ? "" : offline ? "Phone is offline." :
    $("hint").dataset.note ? $("hint").dataset.note :
    queueNext && taskOn ? "Runs after the current task finishes." :
    phoneOnly ? "Approve on your phone, or press Stop." :
    asking ? "Answer the question above, or say stop." :
    running ? "Messages now correct the running task." : "";
}

$("text").addEventListener("input", () => {
  const t = $("text");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
  if (!recorder) delete $("hint").dataset.note;
  updateComposer();
});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("send").classList.contains("stop")) { stopTask(); return; }
  const text = $("text").value;
  const mode = queueNext && last && last.task_id ? "queue" : "auto";
  $("text").value = "";
  $("text").style.height = "auto";
  queueNext = false;
  send(text, mode);
  updateComposer();
});
$("queueToggle").onclick = () => { queueNext = !queueNext; updateComposer(); $("text").focus(); };
$("stopTask").onclick = () => stopTask();
$("model").onchange = async (e) => {
  syncModelLabel();
  if (!deviceId) return;
  try {
    const r = await api(`/api/devices/${deviceId}/model`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: e.target.value }),
    });
    const name = shortModel(modelLabels[r.model] || r.model);
    $("hint").dataset.note = r.applies === "now" ? `Using ${name}.` : `${name} applies from the next task.`;
    updateComposer();
  } catch (err) { setHint(err.message); }
};

// ---------- mic: record in the browser, Whisper transcribes on the server ----------

let recorder = null, recChunks = [], recStarted = 0, recTimer = null, recCancelled = false;
const micReady = window.isSecureContext && navigator.mediaDevices && window.MediaRecorder;
if (!micReady) {
  $("mic").disabled = true;
  $("mic").title = "The mic needs HTTPS or localhost";
}
function setHint(text) { $("hint").dataset.note = text; updateComposer(); }

async function toggleMic() {
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    recChunks = [];
    recCancelled = false;
    recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimer);
      const type = recorder.mimeType || "audio/webm";
      recorder = null;
      $("mic").classList.remove("rec");
      if (recCancelled || !recChunks.length) { setHint(""); return; }
      $("mic").classList.add("busy");
      setHint("Transcribing…");
      const form = new FormData();
      form.append("file", new Blob(recChunks, { type }), "voice.webm");
      try {
        const r = await api("/api/transcribe", { method: "POST", body: form });
        if (r.text) {
          const t = $("text");
          t.value = (t.value.trim() ? t.value.trimEnd() + " " : "") + r.text;
          t.dispatchEvent(new Event("input"));
          t.focus();
          setHint("Check the text, then press Enter to send.");
        } else {
          setHint("Didn't catch that. Try again.");
        }
      } catch (e) { setHint(e.message); }
      $("mic").classList.remove("busy");
    };
    recorder.start();
    recStarted = Date.now();
    $("mic").classList.add("rec");
    const tick = () => {
      const s = Math.floor((Date.now() - recStarted) / 1000);
      setHint(`Recording ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} · click the mic to stop, Esc to cancel`);
    };
    tick();
    recTimer = setInterval(tick, 500);
  } catch (e) {
    setHint(e.name === "NotAllowedError" ? "Microphone blocked. Allow it in the browser's site settings." : `Mic error: ${e.message}`);
  }
}
$("mic").onclick = () => { if (!$("mic").classList.contains("busy")) toggleMic(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && recorder) { recCancelled = true; recorder.stop(); return; }
  if (e.key === "Escape") {
    if (!$("searchOverlay").hidden) { closeSearch(); return; }
    if ($("menu").open) { $("menu").open = false; $("menu").querySelector("summary").focus(); return; }
    if (narrow() && !sidebarHidden) { sidebarHidden = true; applySidebar(); $("sidebarShow").focus(); return; }
    if (narrow() && !panelHidden) { panelHidden = true; applyPanel(); $("panelToggle").focus(); }
  }
});

// ---------- saved chats (sidebar) ----------

let chats = [];
const ago = (t) => {
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;

        const { side, quality } = screenView();
        const res = await api(`/api/devices/${deviceId}/screen.jpg?after=${frameTime}&side=${side}&quality=${quality}`);
        frameTime = res.headers.get("X-Frame-Time") || 0;
        await showFrame(await res.blob());
        if (screenError) { screenError = ""; renderScreenState(); }
      } catch (e) {
        screenError = screenReason(e.message);
        renderScreenState();
        await new Promise((r) => setTimeout(r, 2000));
      }
    }
    // Visible: next frame right away (the server waits for a newer one). Hidden: every 2 s.
    if (!visible) await new Promise((r) => setTimeout(r, deviceId ? 2000 : 400));
  }
}

if (token) {
  for (const id of ["memoryLink"]) $(id).href = "/memory?t=" + encodeURIComponent(token);
  $("home").href = "/?t=" + encodeURIComponent(token);
}
updateComposer();
checkAccount().then((ok) => ok && loadModels().then(loadDevices).then(() => { loadChats(); loadPendingNotes(); statusLoop(); screenLoop(); }));
setInterval(loadChats, 15000);
setInterval(loadPendingNotes, 15000);
setInterval(() => loadDevices(false), 10000);
</script>
</body>
