<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · OpenMob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ds.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .nav { display: flex; align-items: center; justify-content: space-between; max-width: 1040px; width: 100%; margin: 0 auto; padding: 22px 16px; }
  .nav .brand { font-size: 19px; color: var(--fg); text-decoration: none; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 16px 72px; }
  .signin { width: 100%; max-width: 380px; padding: 28px; }
  .signin h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 6px; }
  .signin p.sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  form { display: grid; gap: 14px; }
  .error { color: var(--bad); font-size: 14px; min-height: 20px; margin: -4px 0 0; }
  .submit { width: 100%; }
  .foot { color: var(--muted); font-size: 13px; margin: 18px 0 0; text-align: center; }
  .foot code { font-size: 12px; }
</style>
</head>
<body>
<nav class="nav" aria-label="OpenMob">
  <a class="brand" href="/">OpenMob</a>
</nav>
<main>
  <section class="card signin">
    <h1>Sign in</h1>
    <p class="sub">Welcome back. Sign in to see your phones and chats.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="error" role="alert"></p>
      <button class="btn btn-primary btn-lg submit" id="submit" type="submit">Sign in</button>
    </form>
    <p class="foot">Forgot your password? Ask your server's admin for a sign-in link
      (<code>openmob account link EMAIL</code>).</p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
// Only same-site paths: never bounce to another origin after signing in.
const next = (() => {
  const n = new URLSearchParams(location.search).get("next") || "/";
  return n.startsWith("/") && !n.startsWith("//") ? n : "/";
})();

fetch("/api/auth/me").then((r) => r.json()).then((me) => {
  if (me && me.email) location.replace(next);  // already signed in
}).catch(() => {});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) { $("error").textContent = "Enter your email and password."; return; }
  $("submit").disabled = true;
  $("error").textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (r.ok) { location.replace(next); return; }
    const body = await r.json().catch(() => ({}));
    $("error").textContent = r.status === 429
      ? "Too many attempts. Wait a few minutes and try again."
      : (typeof body.detail === "string" ? body.detail : "Wrong email or password.");
  } catch {
    $("error").textContent = "Couldn't reach the server. Check your connection.";
  }
  $("submit").disabled = false;
  $("password").select();
});
</script>
</body>
</html>
