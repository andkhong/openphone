<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMob Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("openmob.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  /* @ds:start — OpenMob design system v1. This block is identical on every page in openmob/static;
     change it in one page, then copy it to the others (pages have no build step and no shared files). */
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --sunken: #eceef2;
    --fg: #15171b; --muted: #5a606a; --faint: #697079; --line: #e2e5ea; --line-strong: #cdd2da;
    --accent: #3550e8; --accent-hover: #2a43d4; --accent-ink: #ffffff; --accent-soft: #eaeeff; --accent-line: #c6cffd;
    --ok: #157a46; --ok-soft: #e4f4ea; --warn: #9a5a00; --warn-soft: #fdf1dc; --bad: #c42b2f; --bad-soft: #fde8e8;
    --code: #f0f2f5; --overlay: rgba(15, 17, 21, .45);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .06);
    --shadow-lg: 0 4px 10px rgba(16, 24, 40, .06), 0 18px 48px rgba(16, 24, 40, .12);
    --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --gutter: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1013; --surface: #15181c; --surface-2: #1c2025; --sunken: #111317;
      --fg: #e9ebef; --muted: #a2a8b2; --faint: #858c97; --line: #252a31; --line-strong: #343a43;
      --accent: #8193ff; --accent-hover: #97a6ff; --accent-ink: #0b0d12; --accent-soft: #1b2142; --accent-line: #33407a;
      --ok: #4cd48a; --ok-soft: #12291c; --warn: #f0b04a; --warn-soft: #2d2210; --bad: #ff7a72; --bad-soft: #321718;
      --code: #1c2025; --overlay: rgba(0, 0, 0, .6);
      --shadow-sm: none; --shadow: 0 0 0 1px rgba(255,255,255,.02); --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1013; --surface: #15181c; --surface-2: #1c2025; --sunken: #111317;
    --fg: #e9ebef; --muted: #a2a8b2; --faint: #858c97; --line: #252a31; --line-strong: #343a43;
    --accent: #8193ff; --accent-hover: #97a6ff; --accent-ink: #0b0d12; --accent-soft: #1b2142; --accent-line: #33407a;
    --ok: #4cd48a; --ok-soft: #12291c; --warn: #f0b04a; --warn-soft: #2d2210; --bad: #ff7a72; --bad-soft: #321718;
    --code: #1c2025; --overlay: rgba(0, 0, 0, .6);
    --shadow-sm: none; --shadow: 0 0 0 1px rgba(255,255,255,.02); --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, pre, kbd { font-family: var(--mono); font-size: 13px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }

  /* Top bar shared by every signed-in page */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px var(--gutter); min-height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg); text-decoration: none; font-weight: 700; font-size: 17px; letter-spacing: -.015em; white-space: nowrap; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .brand-mark svg { width: 17px; height: 17px; }
  .brand .page-name { font-weight: 500; color: var(--muted); font-size: 15px; letter-spacing: 0; }
  .brand .page-name::before { content: "/"; color: var(--line-strong); margin: 0 8px 0 2px; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 4px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 500; line-height: 1.2; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
  .btn-sm { min-height: 30px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  .btn-lg { min-height: 46px; padding: 12px 20px; font-size: 15px; border-radius: 12px; }
  .btn-block { display: flex; width: 100%; }
  .icon-btn { width: 38px; height: 38px; padding: 0; }

  /* Inputs */
  .input, .select { width: 100%; min-width: 0; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 15px; }
  .input::placeholder { color: var(--faint); }
  .input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field { display: grid; gap: 6px; }
  .field > label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

  /* Layout and cards */
  .page { max-width: 1040px; margin: 0 auto; padding: 28px var(--gutter) 56px; display: grid; gap: 20px; }
  .page.narrow { max-width: 760px; }
  .page-head h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 6px; }
  .page-head p { color: var(--muted); margin: 0; max-width: 62ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .card-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -.005em; margin: 0; display: flex; align-items: center; gap: 8px; }
  .card-head .grow { flex: 1; }
  .card-sub { color: var(--muted); font-size: 14px; margin: -8px 0 14px; }
  .count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .error { color: var(--bad); font-size: 13px; min-height: 1em; }
  .error:empty { min-height: 0; }

  /* Pills: statuses */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; min-height: 22px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
  .pill.dotted::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--accent-soft); color: var(--accent); }
  .pill.live::before { animation: om-pulse 1.4s ease-in-out infinite; }
  @keyframes om-pulse { 50% { opacity: .35; } }

  /* Callouts */
  .callout { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
  .callout > svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
  .callout.info { background: var(--accent-soft); border-color: var(--accent-line); }
  .callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .callout.warn > svg { color: var(--warn); }
  .callout.info > svg { color: var(--accent); }
  .callout b { display: block; }

  /* Code blocks with a copy button */
  .codebox { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: var(--r); }
  .codebox pre { margin: 0; padding: 12px 14px; padding-right: 84px; overflow-x: auto; white-space: pre; line-height: 1.6; }
  .codebox .copy { position: absolute; top: 7px; right: 7px; }
  .codebox.inline pre { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* Tables: stack into labelled cards on phones */
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .table td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
  .table tr:last-child td { border-bottom: 0; }
  .table td.empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  .table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  @media (max-width: 700px) {
    .table thead { display: none; }
    .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
    .table tr { border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px; margin-bottom: 10px; }
    .table td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); text-align: right; }
    .table td:last-child { border-bottom: 0; }
    .table td::before { content: attr(data-label); color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; flex: none; }
    .table td.empty { justify-content: center; } .table td.empty::before { content: none; }
    .table tr.empty-row { border: 0; }
  }

  /* Empty states */
  .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 14px; }
  .empty-state .art { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; background: var(--surface-2); color: var(--faint); display: flex; align-items: center; justify-content: center; }
  .empty-state .art svg { width: 22px; height: 22px; }
  .empty-state b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 2px; }

  @media (max-width: 560px) {
    .page { padding-top: 20px; gap: 16px; }
    .card { padding: 16px; border-radius: var(--r); }
    .page-head h1 { font-size: 22px; }
    .brand .page-name { display: none; }
  }
  /* @ds:end */

  /* ---------- admin ---------- */
  .page { max-width: 1160px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .input { flex: 1; min-width: 0; }
  .updated { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .table tr.revoked td { color: var(--muted); }
  .task { color: var(--muted); font-size: 13px; }
  .task b { color: var(--warn); font-weight: 600; }
  .table code { font-size: 12.5px; }
  .cell-actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
  .msg b { display: block; color: var(--fg); font-size: 18px; margin-bottom: 4px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18h3"/></svg></span>OpenMob<span class="page-name">Admin</span></a>
  <nav class="topnav"><a class="btn btn-ghost" href="/">← Dashboard</a></nav>
</header>
<main class="page" id="main">
  <div class="toolbar">
    <input class="input" id="filter" type="search" placeholder="Filter by email or phone model" autocomplete="off" aria-label="Filter">
    <span class="updated" id="updated"></span>
  </div>

  <section class="card">
    <div class="card-head"><h2>Users <span class="count" id="userCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Email</th><th>Created</th><th>Phones</th><th>API access</th></tr></thead>
      <tbody id="users"><tr class="empty-row"><td class="empty" colspan="4">Loading…</td></tr></tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Devices <span class="count" id="deviceCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Phone</th><th>Owner</th><th>Status</th><th>Activity</th><th>Last seen</th><th>Created</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody id="devices"><tr class="empty-row"><td class="empty" colspan="7">Loading…</td></tr></tbody>
    </table></div>
    <div class="error" id="error" role="alert"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>API keys <span class="count" id="keyCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Key</th><th>Owner</th><th>Scopes</th><th>Last used</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody id="keys"><tr class="empty-row"><td class="empty" colspan="6">Loading…</td></tr></tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>API audit log <span class="count" id="auditCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Time</th><th>Action</th><th>Owner</th><th>Key</th><th>Phone</th><th>Task</th><th>Outcome</th></tr></thead>
      <tbody id="audit"><tr class="empty-row"><td class="empty" colspan="7">Loading…</td></tr></tbody>
    </table></div>
  </section>
</main>
<script>
// Emails and phone models are user-controlled: every value goes in with textContent, never innerHTML.
const $ = (id) => document.getElementById(id);
let users = [], devices = [], keys = [], audit = [];

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function cell(label, ...children) {
  const td = el("td", {}, ...children);
  td.dataset.label = label;
  return td;
}

function date(ts) {
  return ts ? new Date(ts * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
}

function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 10) return "just now";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function emptyRow(cols, text) {
  return el("tr", { className: "empty-row" }, el("td", { className: "empty", colSpan: cols, textContent: text }));
}

function matches(q, ...values) {
  return !q || values.some((v) => String(v || "").toLowerCase().includes(q));
}

function render() {
  const q = $("filter").value.trim().toLowerCase();

  const u = users.filter((a) => matches(q, a.email));
  $("userCount").textContent = u.length;
  $("users").replaceChildren(...(u.length ? u.map((a) => {
    const email = cell("Email", el("span", { textContent: a.email }));
    if (a.is_admin) email.append(el("span", { className: "pill info", textContent: "admin", style: "margin-left:8px" }));
    const apiBtn = el("button", { className: "btn btn-sm", type: "button", textContent: a.api_disabled ? "Turn on" : "Turn off" });
    apiBtn.onclick = () => toggle(`/api/admin/users/${encodeURIComponent(a.id)}/api`, !a.api_disabled,
      `Turn off API access for ${a.email}? Every key stops working and running API tasks are cancelled.`, apiBtn);
    const access = cell("API access", el("span", { className: "cell-actions" }, el("span", { className: `pill dotted ${a.api_disabled ? "bad" : "ok"}`,
      textContent: a.api_disabled ? "Off" : "On" }), apiBtn));
    return el("tr", {}, email, cell("Created", date(a.created)), cell("Phones", String(a.device_count)), access);
  }) : [emptyRow(4, q ? "No users match." : "No users yet.")]));

  const k = keys.filter((x) => matches(q, x.email, x.name, x.prefix));
  $("keyCount").textContent = k.length;
  $("keys").replaceChildren(...(k.length ? k.map((x) => {
    const btn = el("button", { className: "btn btn-sm", type: "button", textContent: x.disabled ? "Turn on" : "Turn off" });
    btn.onclick = () => toggle(`/api/admin/api-keys/${encodeURIComponent(x.id)}/disable`, !x.disabled,
      `Turn off key ${x.prefix} (${x.email})? Its running tasks are cancelled.`, btn);
    return el("tr", { className: x.disabled ? "revoked" : "" },
      cell("Key", el("code", { textContent: x.prefix }), " ", el("span", { className: "task", textContent: x.name })),
      cell("Owner", x.email || "(deleted account)"),
      cell("Scopes", el("span", { className: "task", textContent: x.scopes.join(", ") })),
      cell("Last used", ago(x.last_used)),
      cell("Status", el("span", { className: `pill dotted ${x.disabled ? "bad" : "ok"}`, textContent: x.disabled ? "Off" : "On" })),
      cell("", btn));
  }) : [emptyRow(6, q ? "No keys match." : "No API keys yet.")]));

  const emails = Object.fromEntries(users.map((a) => [a.id, a.email]));
  const l = audit.filter((x) => matches(q, emails[x.account_id], x.action, x.task_id, x.key_id));
  $("auditCount").textContent = l.length;
  $("audit").replaceChildren(...(l.length ? l.map((x) => el("tr", {},
    cell("Time", new Date(x.time * 1000).toLocaleString()),
    cell("Action", el("code", { textContent: x.action })),
    cell("Owner", emails[x.account_id] || "—"),
    cell("Key", x.key_id || "—"),
    cell("Phone", x.device_id || "—"),
    cell("Task", x.task_id || "—"),
    cell("Outcome", x.outcome || "—"),
  )) : [emptyRow(7, q ? "No entries match." : "No API activity yet.")]));

  const d = devices.filter((x) => matches(q, x.email, x.model));
  $("deviceCount").textContent = d.length;
  $("devices").replaceChildren(...(d.length ? d.map((x) => {
    const status = x.revoked ? ["bad", "Revoked"] : x.online ? ["ok", "Connected"] : ["", "Offline"];
    const activity = el("span", { className: "task" });
    if (!x.revoked && x.online && x.state && x.state !== "idle") {
      activity.append(el("b", { textContent: x.state }), x.current ? ` · ${x.current}` : "");
    } else {
      activity.textContent = x.revoked ? "—" : x.online ? "idle" : "—";
    }
    const action = cell("");
    if (!x.revoked) {
      const btn = el("button", { className: "btn btn-sm btn-danger", type: "button", textContent: "Revoke" });
      btn.onclick = () => revoke(x, btn);
      action.append(btn);
    }
    return el("tr", { className: x.revoked ? "revoked" : "" },
      cell("Phone", x.model || "Android phone"),
      cell("Owner", x.email || "(deleted account)"),
      cell("Status", el("span", { className: `pill dotted ${status[0]}`, textContent: status[1] })),
      cell("Activity", activity),
      cell("Last seen", ago(x.last_seen)),
      cell("Created", date(x.created)),
      action);
  }) : [emptyRow(7, q ? "No devices match." : "No phones paired yet.")]));
}

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.status === 401) {
    location.href = "/login?next=" + encodeURIComponent("/admin");
    throw new Error("signed out");
  }
  if (res.status === 403) {
    $("main").replaceChildren(el("div", { className: "card msg" },
      el("b", { textContent: "You're not an admin." }),
      "Ask the server operator to run: openmob account admin YOUR_EMAIL"));
    clearInterval(timer);
    throw new Error("forbidden");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

async function load() {
  try {
    [users, devices, keys, audit] = await Promise.all([api("/api/admin/users"), api("/api/admin/devices"),
      api("/api/admin/api-keys"), api("/api/admin/audit?limit=200")]);
    $("error").textContent = "";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    if ($("error")) $("error").textContent = e.message === "signed out" || e.message === "forbidden" ? "" : `Couldn't refresh: ${e.message}`;
  }
}

async function revoke(device, btn) {
  const who = device.email ? ` (owned by ${device.email})` : "";
  if (!confirm(`Revoke ${device.model || "this phone"}${who}? It disconnects now and must be paired again to reconnect.`)) return;
  btn.disabled = true;
  try {
    await api(`/api/admin/devices/${encodeURIComponent(device.id)}/revoke`, { method: "POST" });
  } catch (e) {
    if (e.message !== "signed out" && e.message !== "forbidden") alert(`Couldn't revoke: ${e.message}`);
  }
  load();
}

async function toggle(path, disabled, question, btn) {
  if (disabled && !confirm(question)) return;
  btn.disabled = true;
  try {
    await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ disabled }) });
  } catch (e) {
    if (e.message !== "signed out" && e.message !== "forbidden") alert(`Couldn't change it: ${e.message}`);
  }
  load();
}

$("filter").addEventListener("input", render);
const timer = setInterval(load, 3000);
load();
</script>
</body>
