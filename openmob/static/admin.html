<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMob Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("openmob.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/static/ds.css">
<style>
  /* ---------- admin ---------- */
  .page { max-width: 1160px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .input { flex: 1; min-width: 0; }
  .updated { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .table tr.revoked td { color: var(--muted); }
  .task { color: var(--muted); font-size: 13px; }
  .task b { color: var(--warn); font-weight: 600; }
  .table code { font-size: 12.5px; }
  .cell-actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
  .msg b { display: block; color: var(--fg); font-size: 18px; margin-bottom: 4px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18h3"/></svg></span>OpenMob<span class="page-name">Admin</span></a>
  <nav class="topnav"><a class="btn btn-ghost" href="/">← Dashboard</a></nav>
</header>
<main class="page" id="main">
  <div class="toolbar">
    <input class="input" id="filter" type="search" placeholder="Filter by email or phone model" autocomplete="off" aria-label="Filter">
    <span class="updated" id="updated"></span>
  </div>

  <section class="card">
    <div class="card-head"><h2>Users <span class="count" id="userCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Email</th><th>Created</th><th>Phones</th><th>API access</th></tr></thead>
      <tbody id="users"><tr class="empty-row"><td class="empty" colspan="4">Loading…</td></tr></tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Devices <span class="count" id="deviceCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Phone</th><th>Owner</th><th>Status</th><th>Activity</th><th>Last seen</th><th>Created</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody id="devices"><tr class="empty-row"><td class="empty" colspan="7">Loading…</td></tr></tbody>
    </table></div>
    <div class="error" id="error" role="alert"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>API keys <span class="count" id="keyCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Key</th><th>Owner</th><th>Scopes</th><th>Last used</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody id="keys"><tr class="empty-row"><td class="empty" colspan="6">Loading…</td></tr></tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>API audit log <span class="count" id="auditCount">0</span></h2></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Time</th><th>Action</th><th>Owner</th><th>Key</th><th>Phone</th><th>Task</th><th>Outcome</th></tr></thead>
      <tbody id="audit"><tr class="empty-row"><td class="empty" colspan="7">Loading…</td></tr></tbody>
    </table></div>
  </section>
</main>
<script>
// Emails and phone models are user-controlled: every value goes in with textContent, never innerHTML.
const $ = (id) => document.getElementById(id);
let users = [], devices = [], keys = [], audit = [];

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function cell(label, ...children) {
  const td = el("td", {}, ...children);
  td.dataset.label = label;
  return td;
}

function date(ts) {
  return ts ? new Date(ts * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
}

function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 10) return "just now";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function emptyRow(cols, text) {
  return el("tr", { className: "empty-row" }, el("td", { className: "empty", colSpan: cols, textContent: text }));
}

function matches(q, ...values) {
  return !q || values.some((v) => String(v || "").toLowerCase().includes(q));
}

function render() {
  const q = $("filter").value.trim().toLowerCase();

  const u = users.filter((a) => matches(q, a.email));
  $("userCount").textContent = u.length;
  $("users").replaceChildren(...(u.length ? u.map((a) => {
    const email = cell("Email", el("span", { textContent: a.email }));
    if (a.is_admin) email.append(el("span", { className: "pill info", textContent: "admin", style: "margin-left:8px" }));
    const apiBtn = el("button", { className: "btn btn-sm", type: "button", textContent: a.api_disabled ? "Turn on" : "Turn off" });
    apiBtn.onclick = () => toggle(`/api/admin/users/${encodeURIComponent(a.id)}/api`, !a.api_disabled,
      `Turn off API access for ${a.email}? Every key stops working and running API tasks are cancelled.`, apiBtn);
    const access = cell("API access", el("span", { className: "cell-actions" }, el("span", { className: `pill dotted ${a.api_disabled ? "bad" : "ok"}`,
      textContent: a.api_disabled ? "Off" : "On" }), apiBtn));
    return el("tr", {}, email, cell("Created", date(a.created)), cell("Phones", String(a.device_count)), access);
  }) : [emptyRow(4, q ? "No users match." : "No users yet.")]));

  const k = keys.filter((x) => matches(q, x.email, x.name, x.prefix));
  $("keyCount").textContent = k.length;
  $("keys").replaceChildren(...(k.length ? k.map((x) => {
    const btn = el("button", { className: "btn btn-sm", type: "button", textContent: x.disabled ? "Turn on" : "Turn off" });
    btn.onclick = () => toggle(`/api/admin/api-keys/${encodeURIComponent(x.id)}/disable`, !x.disabled,
      `Turn off key ${x.prefix} (${x.email})? Its running tasks are cancelled.`, btn);
    return el("tr", { className: x.disabled ? "revoked" : "" },
      cell("Key", el("code", { textContent: x.prefix }), " ", el("span", { className: "task", textContent: x.name })),
      cell("Owner", x.email || "(deleted account)"),
      cell("Scopes", el("span", { className: "task", textContent: x.scopes.join(", ") })),
      cell("Last used", ago(x.last_used)),
      cell("Status", el("span", { className: `pill dotted ${x.disabled ? "bad" : "ok"}`, textContent: x.disabled ? "Off" : "On" })),
      cell("", btn));
  }) : [emptyRow(6, q ? "No keys match." : "No API keys yet.")]));

  const emails = Object.fromEntries(users.map((a) => [a.id, a.email]));
  const l = audit.filter((x) => matches(q, emails[x.account_id], x.action, x.task_id, x.key_id));
  $("auditCount").textContent = l.length;
  $("audit").replaceChildren(...(l.length ? l.map((x) => el("tr", {},
    cell("Time", new Date(x.time * 1000).toLocaleString()),
    cell("Action", el("code", { textContent: x.action })),
    cell("Owner", emails[x.account_id] || "—"),
    cell("Key", x.key_id || "—"),
    cell("Phone", x.device_id || "—"),
    cell("Task", x.task_id || "—"),
    cell("Outcome", x.outcome || "—"),
  )) : [emptyRow(7, q ? "No entries match." : "No API activity yet.")]));

  const d = devices.filter((x) => matches(q, x.email, x.model));
  $("deviceCount").textContent = d.length;
  $("devices").replaceChildren(...(d.length ? d.map((x) => {
    const status = x.revoked ? ["bad", "Revoked"] : x.online ? ["ok", "Connected"] : ["", "Offline"];
    const activity = el("span", { className: "task" });
    if (!x.revoked && x.online && x.state && x.state !== "idle") {
      activity.append(el("b", { textContent: x.state }), x.current ? ` · ${x.current}` : "");
    } else {
      activity.textContent = x.revoked ? "—" : x.online ? "idle" : "—";
    }
    const action = cell("");
    if (!x.revoked) {
      const btn = el("button", { className: "btn btn-sm btn-danger", type: "button", textContent: "Revoke" });
      btn.onclick = () => revoke(x, btn);
      action.append(btn);
    }
    return el("tr", { className: x.revoked ? "revoked" : "" },
      cell("Phone", x.model || "Android phone"),
      cell("Owner", x.email || "(deleted account)"),
      cell("Status", el("span", { className: `pill dotted ${status[0]}`, textContent: status[1] })),
      cell("Activity", activity),
      cell("Last seen", ago(x.last_seen)),
      cell("Created", date(x.created)),
      action);
  }) : [emptyRow(7, q ? "No devices match." : "No phones paired yet.")]));
}

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.status === 401) {
    location.href = "/login?next=" + encodeURIComponent("/admin");
    throw new Error("signed out");
  }
  if (res.status === 403) {
    $("main").replaceChildren(el("div", { className: "card msg" },
      el("b", { textContent: "You're not an admin." }),
      "Ask the server operator to run: openmob account admin YOUR_EMAIL"));
    clearInterval(timer);
    throw new Error("forbidden");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

async function load() {
  try {
    [users, devices, keys, audit] = await Promise.all([api("/api/admin/users"), api("/api/admin/devices"),
      api("/api/admin/api-keys"), api("/api/admin/audit?limit=200")]);
    $("error").textContent = "";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    if ($("error")) $("error").textContent = e.message === "signed out" || e.message === "forbidden" ? "" : `Couldn't refresh: ${e.message}`;
  }
}

async function revoke(device, btn) {
  const who = device.email ? ` (owned by ${device.email})` : "";
  if (!confirm(`Revoke ${device.model || "this phone"}${who}? It disconnects now and must be paired again to reconnect.`)) return;
  btn.disabled = true;
  try {
    await api(`/api/admin/devices/${encodeURIComponent(device.id)}/revoke`, { method: "POST" });
  } catch (e) {
    if (e.message !== "signed out" && e.message !== "forbidden") alert(`Couldn't revoke: ${e.message}`);
  }
  load();
}

async function toggle(path, disabled, question, btn) {
  if (disabled && !confirm(question)) return;
  btn.disabled = true;
  try {
    await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ disabled }) });
  } catch (e) {
    if (e.message !== "signed out" && e.message !== "forbidden") alert(`Couldn't change it: ${e.message}`);
  }
  load();
}

$("filter").addEventListener("input", render);
const timer = setInterval(load, 3000);
load();
</script>
</body>
</html>
