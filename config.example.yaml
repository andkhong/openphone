# Copy to config.yaml (or ~/.config/openmob/config.yaml) and edit.
# Secrets come from the environment: ANTHROPIC_API_KEY, and optionally TYPESAFE_API_KEY for Jev.

# Claude model that looks at the screen and decides each action.
model: claude-sonnet-5-5          # claude-opus-5-5 is smarter but slower
resolver_model: claude-haiku-4-5-20251001
# Models the dashboard's "Model" dropdown offers per phone (an allowlist). The default above is always included.
# models:
#   - {id: claude-sonnet-5-5, label: "Sonnet 5.5 (balanced, recommended)"}
#   - {id: claude-opus-5-5, label: "Opus 5.5 (smartest, slower, pricier)"}
#   - {id: claude-fable-5-1, label: "Fable 5.1"}
#   - {id: claude-haiku-4-5-20251001, label: "Haiku 4.5 (fastest, cheapest)"}
max_steps: 40

# Spoken app names -> package. Run `openmob apps` to find package names.
aliases: {}
  # Example; replace with the real package from `openmob apps`:
  # where winds meet: com.example.wherewindsmeet
  # youtube: com.google.android.youtube

# Phone
# adb_serial: R58M12ABCDE          # only needed with several phones connected
screenshot_max_side: 1280
settle_delay: 0.8                  # seconds to let the screen update after each action
launch_settle_delay: 3.0
ui_tree: auto                      # auto | always | never (accessibility tree; empty in games)
ocr: true                          # Apple Vision OCR for screens without an accessibility tree

# TypeSafe Jev: text-only classifier for screen state, tap risk, and app picking.
# Turns on automatically when TYPESAFE_API_KEY is set.
jev_model: jev-latest
jev_min_confidence: 0.6
jev_risk_threshold: 0.5            # ask before taps Jev rates at least this risky
jev_auto_wait_seconds: 30          # longest time to wait on screens Jev calls "loading"

# Ask before tapping anything that matches these words.
confirm_keywords: [buy, purchase, pay, payment, checkout, top up, recharge, subscribe,
                   send, post, publish, delete, remove, uninstall, transfer, place order, confirm order]

# Spoken replies on the Mac
speak: true
# voice: Samantha

# Phone web page (http://<mac-ip>:8765/?t=<token>)
server_port: 8765
# server_token: pick-a-fixed-token   # otherwise a new one is generated each run
