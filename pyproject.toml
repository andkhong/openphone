[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmob"
version = "0.1.0"
description = "Voice-controlled AI agent that operates your Android phone over ADB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pillow>=10",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyaxmlparser>=0.3.31",
    "websockets>=12",
    "certifi",
]

[project.optional-dependencies]
# Whisper for the dashboard's mic button (transcribed on the server).
voice = [
    "faster-whisper>=1.0",
    "av<19",  # faster-whisper 1.2 passes metadata_errors, which PyAV 19 removed
]
mac = [
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
openmob = "openmob.main:main"

[tool.setuptools.packages.find]
include = ["openmob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
openmob = ["static/*"]
