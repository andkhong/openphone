[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmob"
version = "0.1.0"
description = "Voice-controlled AI agent that operates your Android phone over ADB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pillow>=10",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyaxmlparser>=0.3.31",
    "websockets>=12",
    "certifi",
    "mcp>=2.3",  # the remote MCP server at /mcp and `openmob mcp`
    "cryptography>=42",  # verifying phones' screen-lock-signed approvals
]

[project.optional-dependencies]
# iPhone bridge (openmob bridge --ios): lists installed apps over USB and forwards WebDriverAgent's port.
ios = [
    "pymobiledevice3",
]
mac = [
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]
# More model providers (Anthropic is built in). OpenAI also serves OpenAI-compatible endpoints.
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.30"]  # parameters_json_schema on function declarations
dev = ["pytest>=8"]

[project.scripts]
openmob = "openmob.main:main"

[tool.setuptools.packages.find]
include = ["openmob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
openmob = ["static/*"]
